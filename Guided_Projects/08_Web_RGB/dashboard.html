<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project 8 - RGB Web Control</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17222b}
.wrap{max-width:800px;margin:auto;padding:36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.badge{padding:9px 14px;border-radius:999px;background:#f3e9d2;font-weight:700}
.badge.ok{background:#dff1e6;color:#1f6048}
.card{margin-top:24px;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.status{font-size:42px;font-weight:800;margin:12px 0 22px}
button{border:0;border-radius:11px;padding:14px 24px;font-size:16px;font-weight:800;cursor:pointer;margin:5px}
.red{background:#c93038;color:white}.green{background:#278957;color:white}.blue{background:#246dc1;color:white}.off{background:#dfe3e7;color:#25323c}
@media(max-width:650px){.top{display:block}.badge{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>RGB LED Web Control</h1><p>Raspberry Pi Pico W · Remote color selection</p></div>
    <div id="conn" class="badge">CONNECTING...</div>
  </div>
  <div class="card">
    <b>CURRENT RGB STATE</b>
    <div class="status" id="state">--</div>
    <button class="red" onclick="setColor('RED')">RED</button>
    <button class="green" onclick="setColor('GREEN')">GREEN</button>
    <button class="blue" onclick="setColor('BLUE')">BLUE</button>
    <button class="off" onclick="setColor('OFF')">OFF</button>
  </div>
</div>
<script>
const broker='wss://broker.emqx.io:8084/mqtt';
const stateTopic='dcr/iot-m4-tank-2026/project8/state';
const commandTopic='dcr/iot-m4-tank-2026/project8/rgb/set';
const client=mqtt.connect(broker,{
  clientId:'dcr_p8_web_'+Math.random().toString(16).slice(2),
  clean:true,connectTimeout:5000,reconnectPeriod:2000
});
const conn=document.getElementById('conn');
client.on('connect',()=>{conn.textContent='CONNECTED';conn.classList.add('ok');client.subscribe(stateTopic);});
client.on('reconnect',()=>{conn.textContent='RECONNECTING...';conn.classList.remove('ok');});
client.on('offline',()=>{conn.textContent='OFFLINE';conn.classList.remove('ok');});
client.on('error',()=>{conn.textContent='CONNECTION ERROR';conn.classList.remove('ok');});
client.on('message',(topic,payload)=>{document.getElementById('state').textContent=payload.toString();});
function setColor(name){client.publish(commandTopic,name,{qos:0,retain:false});}
</script>
</body>
</html>
