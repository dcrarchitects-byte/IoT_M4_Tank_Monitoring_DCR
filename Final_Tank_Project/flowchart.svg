<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1220" viewBox="0 0 900 1220">
<rect width="900" height="1220" fill="white"/>
<style>
text{font-family:Arial;fill:#173b31}.b{fill:#fff;stroke:#9fb8ac;stroke-width:2}
.g{fill:#dcefe5;stroke:#1f6048;stroke-width:3}.d{fill:#fff4dc;stroke:#d6a21c;stroke-width:3}
.r{fill:#fae9ea;stroke:#b92e35;stroke-width:3}.l{stroke:#1f6048;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f6048"/></marker></defs>
<text x="60" y="48" font-size="30" font-weight="700">Annotated Program Flowchart</text>
<ellipse class="g" cx="450" cy="105" rx="220" ry="44"/>
<text x="450" y="98" text-anchor="middle" font-size="20" font-weight="700">START / RESET</text>
<text x="450" y="124" text-anchor="middle" font-size="15">Initialize GPIO, sensors, RGB and LEDs</text>
<rect class="b" x="275" y="185" width="350" height="78" rx="15"/>
<text x="450" y="216" text-anchor="middle" font-size="19">Connect Pico W to Wokwi-GUEST</text>
<text x="450" y="242" text-anchor="middle" font-size="14">Outgoing internet connection</text>
<rect class="b" x="250" y="305" width="400" height="82" rx="15"/>
<text x="450" y="337" text-anchor="middle" font-size="19">Connect to public MQTT broker</text>
<text x="450" y="363" text-anchor="middle" font-size="14">Subscribe to pump command topic</text>
<rect class="b" x="250" y="430" width="400" height="82" rx="15"/>
<text x="450" y="462" text-anchor="middle" font-size="19">Every 5 s: read DHT22 + HC-SR04</text>
<text x="450" y="488" text-anchor="middle" font-size="14">Validate readings and preserve fault state</text>
<polygon class="d" points="450,550 600,610 450,670 300,610"/>
<text x="450" y="616" text-anchor="middle" font-size="18">Temperature range?</text>
<rect class="b" x="60" y="715" width="220" height="75" rx="14"/>
<text x="170" y="745" text-anchor="middle" font-size="17">Cold &lt; 20 °C</text>
<text x="170" y="770" text-anchor="middle" font-size="15">RGB BLUE</text>
<rect class="g" x="340" y="715" width="220" height="75" rx="14"/>
<text x="450" y="745" text-anchor="middle" font-size="17">20–30 °C</text>
<text x="450" y="770" text-anchor="middle" font-size="15">RGB GREEN</text>
<rect class="r" x="620" y="715" width="220" height="75" rx="14"/>
<text x="730" y="745" text-anchor="middle" font-size="17">Hot &gt; 30 °C</text>
<text x="730" y="770" text-anchor="middle" font-size="15">RGB RED</text>
<polygon class="d" points="450,835 600,890 450,945 300,890"/>
<text x="450" y="896" text-anchor="middle" font-size="18">Distance &lt; 10 cm?</text>
<rect class="r" x="170" y="982" width="240" height="72" rx="14"/>
<text x="290" y="1012" text-anchor="middle" font-size="17">YES · Red alert ON</text>
<text x="290" y="1037" text-anchor="middle" font-size="14">Tank warning state</text>
<rect class="g" x="490" y="982" width="240" height="72" rx="14"/>
<text x="610" y="1012" text-anchor="middle" font-size="17">NO · Red alert OFF</text>
<text x="610" y="1037" text-anchor="middle" font-size="14">Tank status normal</text>
<rect class="b" x="245" y="1090" width="410" height="82" rx="15"/>
<text x="450" y="1121" text-anchor="middle" font-size="18">Publish status and process MQTT command</text>
<text x="450" y="1147" text-anchor="middle" font-size="14">Browser dashboard receives data; pump ON/OFF updates GP17</text>
<path class="l" d="M450 149 V185"/><path class="l" d="M450 263 V305"/><path class="l" d="M450 387 V430"/>
<path class="l" d="M450 512 V550"/><path class="l" d="M360 655 L210 715"/><path class="l" d="M450 670 V715"/>
<path class="l" d="M540 655 L690 715"/><path class="l" d="M170 790 L365 845"/><path class="l" d="M450 790 V835"/>
<path class="l" d="M730 790 L535 845"/><path class="l" d="M375 935 L310 982"/><path class="l" d="M525 935 L590 982"/>
<path class="l" d="M290 1054 C290 1072 450 1072 450 1090"/><path class="l" d="M610 1054 C610 1072 450 1072 450 1090"/>
</svg>