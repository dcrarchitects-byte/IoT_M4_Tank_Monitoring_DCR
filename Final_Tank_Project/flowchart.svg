<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="white"/><style>text{font-family:Arial;fill:#173b31}.b{fill:#fff;stroke:#9fb8ac;stroke-width:2}.g{fill:#dcefe5;stroke:#1f6048;stroke-width:3}.d{fill:#fff4dc;stroke:#d6a21c;stroke-width:3}.r{fill:#fae9ea;stroke:#b92e35;stroke-width:3}.l{stroke:#1f6048;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f6048"/></marker></defs><text x="60" y="50" font-size="30" font-weight="700">Annotated Program Flowchart</text><ellipse class="g" cx="450" cy="110" rx="220" ry="45"/><text x="450" y="102" text-anchor="middle" font-size="20" font-weight="700">START / RESET</text><text x="450" y="128" text-anchor="middle" font-size="15">Initialize GPIO, sensors, RGB and LEDs</text><rect class="b" x="275" y="190" width="350" height="80" rx="15"/><text x="450" y="222" text-anchor="middle" font-size="19">Connect Pico W to Wi-Fi</text><text x="450" y="248" text-anchor="middle" font-size="14">Input SSID/password · Output IP address</text><rect class="b" x="275" y="315" width="350" height="80" rx="15"/><text x="450" y="348" text-anchor="middle" font-size="19">Open HTTP server</text><text x="450" y="374" text-anchor="middle" font-size="14">/ · /data · /pump/on · /pump/off</text><rect class="b" x="255" y="440" width="390" height="80" rx="15"/><text x="450" y="472" text-anchor="middle" font-size="19">Every 5 s: read DHT22 + HC-SR04</text><text x="450" y="498" text-anchor="middle" font-size="14">Validate readings and preserve fault state</text><polygon class="d" points="450,560 600,620 450,680 300,620"/><text x="450" y="626" text-anchor="middle" font-size="18">Temperature range?</text><rect class="b" x="60" y="725" width="220" height="75" rx="14"/><text x="170" y="755" text-anchor="middle" font-size="17">Cold &lt; 20 °C</text><text x="170" y="780" text-anchor="middle" font-size="15">RGB BLUE</text><rect class="g" x="340" y="725" width="220" height="75" rx="14"/><text x="450" y="755" text-anchor="middle" font-size="17">20–30 °C</text><text x="450" y="780" text-anchor="middle" font-size="15">RGB GREEN</text><rect class="r" x="620" y="725" width="220" height="75" rx="14"/><text x="730" y="755" text-anchor="middle" font-size="17">Hot &gt; 30 °C</text><text x="730" y="780" text-anchor="middle" font-size="15">RGB RED</text><polygon class="d" points="450,850 600,905 450,960 300,905"/><text x="450" y="911" text-anchor="middle" font-size="18">Distance &lt; 10 cm?</text><rect class="r" x="170" y="1000" width="240" height="75" rx="14"/><text x="290" y="1030" text-anchor="middle" font-size="17">YES · Red alert ON</text><text x="290" y="1055" text-anchor="middle" font-size="14">Assignment warning</text><rect class="g" x="490" y="1000" width="240" height="75" rx="14"/><text x="610" y="1030" text-anchor="middle" font-size="17">NO · Red alert OFF</text><text x="610" y="1055" text-anchor="middle" font-size="14">Tank status normal</text><path class="l" d="M450 155 V190"/><path class="l" d="M450 270 V315"/><path class="l" d="M450 395 V440"/><path class="l" d="M450 520 V560"/><path class="l" d="M360 665 L210 725"/><path class="l" d="M450 680 V725"/><path class="l" d="M540 665 L690 725"/><path class="l" d="M170 800 L365 860"/><path class="l" d="M450 800 V850"/><path class="l" d="M730 800 L535 860"/><path class="l" d="M375 950 L310 1000"/><path class="l" d="M525 950 L590 1000"/><text x="470" y="1135" text-anchor="middle" font-size="16">After local indicators: handle HTTP request, apply pump ON/OFF command or return dashboard/JSON, then loop.</text></svg>